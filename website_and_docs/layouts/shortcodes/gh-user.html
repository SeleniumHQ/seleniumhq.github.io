{{ $login := path.Base (trim (.Get 0) " ") }}
{{ $name := index site.Data.github_users (lower $login) | default $login }}

    <div class="card text-center bg-transparent border-0 p-2 h-100" style="max-width: 12rem;">
      <img src="https://avatars.githubusercontent.com/{{$login}}" class="card-img-top mx-auto" alt="{{$name}}" style="max-width: 122px;">
      <div class="card-body pb-0 px-1">
        <p class="card-text m-0">
          {{$name}}
        </p>
      </div>
      <div class="card-footer bg-transparent border-0 px-1">
        <p>
          <a href="https://github.com/{{$login}}">@{{$login}}</a>
        </p>
      </div>
    </div>
