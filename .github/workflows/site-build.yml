# No SELENIUM_CI_TOKEN on purpose: API-backed shortcodes render placeholders, so this makes no GitHub API calls
name: Site build

on:
  workflow_dispatch:
  push:
    branches:
    - trunk
    paths:
      - 'website_and_docs/**'
  pull_request:
    paths:
      - 'website_and_docs/**'

jobs:
  build:
    name: Build (no GitHub API)
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.169.0'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '26.12.1'
          cache: 'npm'
          # The action defaults to search for the dependency file (package-lock.json,
          # npm-shrinkwrap.json or yarn.lock) in the repository root, and uses its
          # hash as a part of the cache key.
          # https://github.com/actions/setup-node/blob/main/docs/advanced-usage.md#caching-packages-data
          cache-dependency-path: '**/package-lock.json'

      - run: npm ci
        working-directory: website_and_docs
      - run: |
          source ../scripts/setup-dart-sass-path.sh
          hugo --destination $GITHUB_WORKSPACE/website_and_docs/public
        working-directory: website_and_docs

      - name: Link check
        continue-on-error: true # <- If set to false, run fails with broken links
        uses: untitaker/hyperlink@0.3.2
        with:
          args: website_and_docs/public/ --check-anchors

      - name: Archive hyperlink results
        uses: actions/upload-artifact@v7
        with:
          name: hyperlink-report
          path: website_and_docs/tmp/.hyperlink/hyperlink.log
          retention-days: 7 # default is 90 days
