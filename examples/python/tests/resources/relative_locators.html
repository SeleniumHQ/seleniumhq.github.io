<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Relative Locators</title>
  <style>
    form { width: 300px; font-family: sans-serif; }
    label, input { display: block; margin-bottom: 8px; }
    input { width: 100%; }
    button { margin-top: 8px; }
  </style>
</head>
<body>
  <form>
    <label id="lbl-email" for="email">Email Address</label>
    <input id="email" type="text">
    <label id="lbl-password" for="password">Password</label>
    <input id="password" type="password">
    <button id="cancel" type="button">Cancel</button>
    <button id="submit" type="button">Submit</button>
  </form>
</body>
</html>
